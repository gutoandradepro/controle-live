<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Controle da Live · Extremo Rec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: painel de régie, direto, sem enfeite
   IDEA: a mesa de corte de uma ilha de transmissão, botões grandes que acendem
   PICTURE: os próprios botões; o botão ativo acende em verde-limão
   COLOUR and TYPE: preto #0d0d0d, limão #dbfc02, vermelho REC #ff3b30; Inter Tight + Roboto Mono
   LAYOUT: uma coluna para o polegar, seções empilhadas, status fixo no topo */
:root{--bg:#0d0d0d;--panel:#171717;--panel2:#1f1f1f;--line:rgba(255,255,255,.12);--ink:#f2f2ee;--mute:#9a9a95;--lime:#dbfc02;--rec:#ff3b30;--amber:#ff9f0a;
  --display:"Extremo Display","Inter Tight","Helvetica Neue",Arial,sans-serif;--mono:"Roboto Mono",ui-monospace,monospace}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--display)}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:rgba(13,13,13,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{width:118px;height:auto;fill:#fff}
.conn{display:flex;align-items:center;gap:8px;font:700 12px var(--mono);letter-spacing:1px;color:var(--mute)}
.conn i{width:10px;height:10px;border-radius:50%;background:#555}
.conn.on i{background:var(--rec);box-shadow:0 0 10px var(--rec);animation:blink 1.2s steps(1) infinite}
.conn.on{color:#fff}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 9px;background:var(--panel);border:1px solid var(--line);font:700 11px var(--mono);letter-spacing:.5px;color:var(--mute)}
.chip i{width:7px;height:7px;background:#444}
.chip.ok{color:#fff}.chip.ok i{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.chip.wait i{background:var(--amber)}
main{padding:6px 16px 0;max-width:560px;margin:0 auto}
section{margin-top:22px}
h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;font:900 26px/1 var(--display);letter-spacing:-1px;text-transform:uppercase}
h2 small{font:700 12px var(--mono);letter-spacing:.5px;text-transform:none;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.b{position:relative;min-height:64px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  transition:transform .08s,background .2s,border-color .2s;overflow:hidden}
.b:active{transform:scale(.97)}
.b .k{font:700 11px var(--mono);letter-spacing:1px;color:var(--mute)}
.b .t{font:800 19px/1.1 var(--display);letter-spacing:-.4px}
.b.wide{grid-column:1/-1}
.b.go{background:var(--lime);color:#111;border-color:var(--lime)}
.b.go .k{color:rgba(17,17,17,.65)}
.b.red{border-color:rgba(255,59,48,.45)}
.b.red .t{color:#ff6b62}
.b.small{min-height:52px}.b.small .t{font-size:17px}
.b.lit{border-color:var(--lime);background:#20230b}
.b.lit::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.b.sent{animation:sent .5s}
@keyframes sent{0%{box-shadow:inset 0 0 0 2px var(--lime)}100%{box-shadow:inset 0 0 0 2px transparent}}
.b.arm{background:var(--rec);border-color:var(--rec);color:#fff}.b.arm .t{color:#fff}.b.arm .k{color:#ffd9d6}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);grid-column:1/-1;min-height:56px;text-align:left}
.tog .t{font:800 17px var(--display)}
.sw{flex:none;width:52px;height:30px;background:#333;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;background:#fff;transition:transform .2s}
.tog[aria-checked=true] .sw{background:var(--lime)}.tog[aria-checked=true] .sw::after{transform:translateX(22px);background:#111}
.scenes .b .t{font-size:17px}
.hint{padding:14px;background:var(--panel);border:1px dashed var(--line);color:var(--mute);font-size:14px;line-height:1.45}
.hint b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,40px);opacity:0;padding:12px 18px;background:#fff;color:#111;font:700 14px var(--mono);
  transition:transform .25s,opacity .25s;z-index:20;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.foot{margin-top:28px;padding:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 12px var(--mono);color:var(--mute)}
.foot button{padding:10px 12px;background:var(--panel);border:1px solid var(--line);font:700 12px var(--mono)}
#setup{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:24px}
#setup.on{display:flex}
#setup h1{font:900 40px/.95 var(--display);letter-spacing:-2px;text-transform:uppercase;margin:0 0 14px}
#setup h1 span{color:var(--lime)}
#setup p{color:var(--mute);margin:0 0 18px}
#setup input{width:100%;padding:16px;font:700 16px var(--mono);background:var(--panel);border:1px solid var(--line);color:#fff;outline:none}
#setup input:focus{border-color:var(--lime)}
#setup .b{margin-top:10px;min-height:56px}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ===== TABLET: tudo em uma tela, sem rolar ===== */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{position:static;flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px}
.top .row1{flex:none;gap:14px}
.chips{flex:1;margin:0;padding:0}
.tools{flex:none;display:flex;gap:6px}
.tools button{padding:8px 12px;background:var(--panel);border:1px solid var(--line);font:700 12px var(--mono);color:var(--mute)}
main{flex:1;min-height:0;max-width:none;margin:0;padding:12px 16px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
section{margin:0;display:flex;flex-direction:column;min-height:0;flex:1}
section.s-sm{flex:.55}
h2{flex:none;font-size:clamp(17px,2.2vw,24px);margin-bottom:8px}
.grid{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.b,.b.small{min-height:0;padding:clamp(6px,1.1vh,12px) 12px}
.b .t{font-size:clamp(14px,1.75vw,20px)}
.b.small .t{font-size:clamp(13px,1.55vw,17px)}
.b .k{font-size:clamp(9px,1vw,11px)}
.tog{min-height:0;padding:8px 12px}
.tog .t{font-size:clamp(14px,1.6vw,17px)}
#scenes{overflow-y:auto}
.hint{font-size:13px}
.foot{display:none}
/* tablet em pé: duas colunas */
@media (orientation:portrait){
  main{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
  .col.c3{display:contents}
  .col.c2{grid-row:span 1}
  .b .t{font-size:clamp(14px,2.4vw,20px)}.b.small .t{font-size:clamp(13px,2.1vw,17px)}.b .k{font-size:clamp(9px,1.4vw,11px)}
  h2{font-size:clamp(17px,3vw,24px)}
}
/* celular pequeno: volta a rolar */
@media (max-width:600px){
  html,body{height:auto;overflow:auto}
  main{display:block}.col{display:block}section{margin-top:18px}.grid{grid-auto-rows:auto}
  .b{min-height:60px}.chips{display:none}
}

/* ===== miniaturas de prévia nos botões ===== */
.b.img{background-color:#111;background-size:cover;background-repeat:no-repeat;border-color:rgba(255,255,255,.18)}
.b.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,13,.05) 0%,rgba(13,13,13,.25) 45%,rgba(13,13,13,.94) 100%);pointer-events:none}
.b.img>*{position:relative;z-index:1}
.b.img .k{color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000;align-self:flex-start;padding:2px 6px;background:rgba(13,13,13,.7)}
.b.img .t{text-shadow:0 2px 8px #000}
.b.go.img{color:#fff;border-color:var(--lime);box-shadow:inset 0 -6px 0 var(--lime)}
.b.go.img .t{color:var(--lime)}
.b.go.img .k{color:#111;background:var(--lime)}
.b.img.lit{box-shadow:inset 0 0 0 2px var(--lime)}
.b.img.arm{background-image:none!important}

.b.side{flex-direction:row;align-items:center;gap:10px;padding-right:8px}
.b.side .tx{flex:none;display:flex;flex-direction:column;gap:4px;max-width:46%}
.b.side .th{flex:1;align-self:stretch;margin:-2px 0;background:#0d0d0d center/contain no-repeat;border:1px solid rgba(255,255,255,.08)}
.b.vj{background-size:contain!important;background-color:#0b0b0b}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="col c1">
  <section>
    <h2>Cenas <small id="cenaAtual"></small></h2>
    <div class="grid scenes" id="scenes"><div class="hint wide" style="grid-column:1/-1">Coloque o <b>receptor-obs.html</b> no OBS para trocar de cena por aqui.</div></div>

  <section class="s-sm">

<div id="setup">
  <h1>Controle<br>da <span>live.</span></h1>
  <p>Cole o código do canal que está nos seus overlays. Ele fica salvo neste celular.</p>
  <input id="canalIn" placeholder="extremorec-..." autocapitalize="off" autocomplete="off" spellcheck="false">
  <button class="b go" id="salvar"><span class="k">CONECTAR</span><span class="t">Salvar e entrar</span></button>
</div>
<div class="toast" id="toast"></div>

<script>
{
const RELAY = (new URLSearchParams(location.search).get("relay") || "https://ntfy.sh").replace(/\/$/, "");
const NAMES = { rankings: "Rankings", boasvindas: "Boas-vindas", oferta: "Oferta", creditos: "Créditos", voltoja: "Volto já", obs: "OBS" };
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let canal = (location.hash || "").replace(/^#/, "").trim() || store.get("canal-live") || "";
if (location.hash) store.set("canal-live", canal);
const seen = {}; let ws = null, cenaAtual = "", musica = true;

// status dos overlays
$("chips").innerHTML = Object.entries(NAMES).map(([k, n]) => `<span class="chip" id="ch-${k}"><i></i>${n}</span>`).join("");
function chip(k, state) { const c = $("ch-" + k); if (c) { c.classList.toggle("ok", state === "ok"); c.classList.toggle("wait", state === "wait"); } }

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1600); }
function buzz(ms = 15) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

async function send(alvo, cmd, arg) {
  if (!canal) return false;
  try { await fetch(`${RELAY}/${canal}`, { method: "POST", body: JSON.stringify({ de: "controle", alvo, cmd, arg }) }); return true; }
  catch (e) { toast("SEM INTERNET?"); return false; }
}
function ping() {
  Object.keys(NAMES).forEach(k => { if (!seen[k] || Date.now() - seen[k] > 90000) chip(k, "wait"); });
  send("todos", "ping"); setTimeout(() => send("obs", "status"), 600);
  setTimeout(() => Object.keys(NAMES).forEach(k => { if (!seen[k] || Date.now() - seen[k] > 8000) chip(k, ""); }), 7000);
}

function renderScenes(list) {
  if (!list || !list.length) return;
  $("scenes").innerHTML = list.map(n => `<button class="b small${n === cenaAtual ? " lit" : ""}" data-scene="${encodeURIComponent(n)}"><span class="k">CENA</span><span class="t"></span></button>`).join("");
  [...$("scenes").children].forEach((b, i) => b.querySelector(".t").textContent = list[i]);
}
function markScene(n) { cenaAtual = n || ""; $("cenaAtual").textContent = cenaAtual ? "NO AR: " + cenaAtual : "";
  [...$("scenes").querySelectorAll("[data-scene]")].forEach(b => b.classList.toggle("lit", decodeURIComponent(b.dataset.scene) === cenaAtual)); }

function onInfo(nome, info) {
  if (!info) return;
  if (nome === "obs") {
    if (info.erro === "sem-permissao") $("scenes").innerHTML = `<div class="hint" style="grid-column:1/-1">No OBS, abra a fonte do <b>receptor-obs</b> e mude <b>Permissões da página</b> para <b>Acesso avançado ao OBS</b>.</div>`;
    if (info.cenas) { const names = info.cenas.map(c => typeof c === "string" ? c : c.name); cenaAtual = info.atual || cenaAtual; renderScenes(names); }
    if (info.atual) markScene(info.atual);
  }
  if (nome === "oferta" && "auto" in info) { $("autoTog").setAttribute("aria-checked", String(!!info.auto)); }
  if (nome === "creditos" && "pessoas" in info) $("crInfo").textContent = info.pessoas + " PARTICIPANTE" + (info.pessoas === 1 ? "" : "S");
  if (nome === "voltoja" && "restante" in info) { const s = info.restante; $("vjInfo").textContent = s ? "FALTAM " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0") : ""; }
}

function connect() {
  if (!canal) return;
  try { ws = new WebSocket(RELAY.replace(/^http/, "ws") + "/" + canal + "/ws"); } catch (e) { setTimeout(connect, 4000); return; }
  ws.onopen = () => { $("conn").classList.add("on"); $("connTxt").textContent = "NO AR"; ping(); };
  ws.onclose = () => { $("conn").classList.remove("on"); $("connTxt").textContent = "RECONECTANDO"; setTimeout(connect, 3000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = e => {
    let m, c; try { m = JSON.parse(e.data); if (m.event !== "message") return; c = JSON.parse(m.message); } catch (_) { return; }
    if (!c || c.de !== "overlay" || !NAMES[c.nome]) return;
    seen[c.nome] = Date.now(); chip(c.nome, "ok");
    if (c.tipo === "cena" && c.info) markScene(c.info.atual);
    onInfo(c.nome, c.info);
  };
}

// botões
document.addEventListener("click", async e => {
  const sc = e.target.closest("[data-scene]");
  if (sc) { buzz(); const n = decodeURIComponent(sc.dataset.scene); if (await send("obs", "cena", n)) { markScene(n); toast("CENA: " + n.toUpperCase()); } return; }
  const b = e.target.closest("button[data-a]"); if (!b) return;
  if (b.dataset.confirm && !b.classList.contains("arm")) {
    b.classList.add("arm"); b._old = b.querySelector(".t").textContent; b.querySelector(".t").textContent = "Toque de novo";
    buzz(30); clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove("arm"); b.querySelector(".t").textContent = b._old; }, 3000); return;
  }
  if (b.classList.contains("arm")) { clearTimeout(b._t); b.classList.remove("arm"); b.querySelector(".t").textContent = b._old; }
  let arg = b.dataset.v;
  if (b.id === "musBtn") { musica = !musica; arg = musica; b.classList.toggle("lit", musica); }
  buzz();
  if (await send(b.dataset.a, b.dataset.c, arg)) {
    b.classList.remove("sent"); void b.offsetWidth; b.classList.add("sent");
    toast("ENVIADO · " + (NAMES[b.dataset.a] || "").toUpperCase());
    if (b.dataset.a === "voltoja" || b.dataset.a === "creditos") setTimeout(() => send(b.dataset.a, "ping-info"), 900);
  }
});
$("musBtn").classList.add("lit");
$("autoTog").addEventListener("click", async () => {
  const on = $("autoTog").getAttribute("aria-checked") !== "true"; buzz();
  if (await send("oferta", "auto", on)) { $("autoTog").setAttribute("aria-checked", String(on)); toast(on ? "AUTOMÁTICO LIGADO" : "AUTOMÁTICO DESLIGADO"); }
});
$("pingBtn").addEventListener("click", () => { buzz(); ping(); toast("ATUALIZANDO STATUS"); });
$("trocaBtn").addEventListener("click", () => { $("canalIn").value = canal; $("setup").classList.add("on"); });
$("salvar").addEventListener("click", () => {
  const v = $("canalIn").value.trim().replace(/^#/, ""); if (!v) return;
  canal = v; store.set("canal-live", v); $("setup").classList.remove("on"); $("canalTxt").textContent = "···" + canal.slice(-4);
  try { ws && ws.close(); } catch (e) {} if (!ws) connect();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && ws && ws.readyState === 1) ping(); });
setInterval(() => { if (!document.hidden && ws && ws.readyState === 1) ping(); }, 60000);

if (!canal) $("setup").classList.add("on"); else { $("canalTxt").textContent = "···" + canal.slice(-4); connect(); }
}
</script>
</body>
</html>
